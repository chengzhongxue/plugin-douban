<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">

<head>
    <title th:text="${title}"></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <th:block th:replace="~{plugin:plugin-douban:modules/style}"></th:block>
    <style>
        h1,
        h2,
        h3,
        h4,
        h5 {
            margin-top: 0;
            margin-bottom: 0;
            font-weight: 400;
        }

        .metabar--block {
            pointer-events: auto;
            display: flex;
            align-items: center;
            position: relative;
            height: 68px;
            font-size: 14px;
            justify-content: center;
        }

        .layoutSingleColumn {
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
            width: 92%;
        }

        .layoutSingleColumn--wide {
            max-width: 1180px;
        }

        .u-paddingTop50 {
            padding-top: 50px
        }
    </style>
</head>

<body>
<header class="metabar metabar--bordered">
    <div class="metabar--block" itemprop="publisher" itemscope="">
        <h1 class="metabar--headline" itemprop="logo" itemscope="" th:text="${title}"></h1>
    </div>
</header>
<main class="main">
    <div class="layoutSingleColumn layoutSingleColumn--wide u-paddingTop50">
        <th:block th:replace="~{plugin:plugin-douban:modules/douban}"></th:block>
    </div>
</main>
<th:block th:replace="~{plugin:plugin-douban:modules/script}"></th:block>
</body>

</html>
